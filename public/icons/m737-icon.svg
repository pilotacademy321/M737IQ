<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="50%" stop-color="#003366"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#2dd4bf" stroke-width="3" opacity="0.4"/>

  <!-- Stethoscope -->
  <path d="M 140 180 C 140 290, 210 340, 256 340 C 302 340, 372 290, 372 180" 
        fill="none" 
        stroke="url(#tealGrad)" 
        stroke-width="22" 
        stroke-linecap="round" />

  <path d="M 180 130 L 180 160 M 332 130 L 332 160" 
        stroke="#38bdf8" 
        stroke-width="18" 
        stroke-linecap="round" />
  <circle cx="180" cy="115" r="14" fill="#2dd4bf" />
  <circle cx="332" cy="115" r="14" fill="#2dd4bf" />

  <!-- ECG Pulse -->
  <path d="M 90 260 L 170 260 L 200 205 L 235 345 L 275 140 L 310 320 L 340 235 L 360 260 L 422 260" 
        fill="none" 
        stroke="#e11d48" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <circle cx="275" cy="140" r="18" fill="#fb7185" />
  <circle cx="275" cy="140" r="10" fill="#ffffff" />

  <text x="256" y="440" 
        font-family="system-ui, -apple-system, 'Cairo', 'Plus Jakarta Sans', sans-serif" 
        font-size="88" 
        font-weight="900" 
        letter-spacing="2" 
        text-anchor="middle"
        fill="#ffffff">
    صحتك
  </text>
</svg>
