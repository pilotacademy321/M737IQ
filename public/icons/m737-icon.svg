<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="50%" stop-color="#003366"/>
      <stop offset="100%" stop-color="#002244"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle corner rounding -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>

  <!-- Flight Arch Path -->
  <path d="M 80 280 C 150 140, 270 95, 395 105" 
        fill="none" 
        stroke="url(#cyanGrad)" 
        stroke-width="14" 
        stroke-linecap="round" 
        opacity="0.95" />

  <!-- Airplane Silhouette climbing to top right -->
  <g transform="translate(395, 105) rotate(18) scale(2.2)">
    <path d="M 0 -7 L 4 -2 L 11 -2 L 13 -4 L 14 -4 L 13 0 L 14 4 L 13 4 L 11 2 L 4 2 L 0 7 L -2 7 L 0 2 L -8 2 L -11 5 L -13 5 L -12 0 L -13 -5 L -11 -5 L -8 -2 L 0 -2 Z" 
          fill="#38bdf8" />
  </g>

  <!-- Medical ECG Pulse Wave forming the M base -->
  <path d="M 70 250 L 130 250 L 150 205 L 175 305 L 210 150 L 245 330 L 275 225 L 305 260 L 325 250 L 390 250" 
        fill="none" 
        stroke="#e11d48" 
        stroke-width="15" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Pulse node glow dot -->
  <circle cx="210" cy="150" r="14" fill="#fb7185" />
  <circle cx="210" cy="150" r="8" fill="#ffffff" />

  <!-- Typography: M737 -->
  <text x="256" y="415" 
        font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Cairo, sans-serif" 
        font-size="82" 
        font-weight="900" 
        letter-spacing="2" 
        text-anchor="middle">
    <tspan fill="#e11d48">M</tspan><tspan fill="#ffffff">737</tspan>
  </text>

  <!-- Tagline: MEDICAL -->
  <text x="256" y="458" 
        font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Cairo, sans-serif" 
        font-size="20" 
        font-weight="700" 
        letter-spacing="9" 
        fill="#38bdf8" 
        text-anchor="middle">
    MEDICAL
  </text>
</svg>
