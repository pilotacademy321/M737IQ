
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001833"/>
      <stop offset="50%" stop-color="#003366"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="tealG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgG)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#2dd4bf" stroke-width="3.5" opacity="0.45"/>

  <!-- Stethoscope Chestpiece Loop -->
  <path d="M 140 170 C 140 280, 210 330, 256 330 C 302 330, 372 280, 372 170" 
        fill="none" stroke="url(#tealG)" stroke-width="22" stroke-linecap="round" />

  <!-- Binaural Earpieces -->
  <path d="M 180 120 L 180 150 M 332 120 L 332 150" 
        stroke="#38bdf8" stroke-width="18" stroke-linecap="round" />
  <circle cx="180" cy="105" r="14" fill="#2dd4bf" />
  <circle cx="332" cy="105" r="14" fill="#2dd4bf" />

  <!-- Medical ECG Heartbeat Pulse Wave -->
  <path d="M 90 250 L 170 250 L 200 195 L 235 335 L 275 130 L 310 310 L 340 225 L 360 250 L 422 250" 
        fill="none" stroke="#e11d48" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#iconGlow)" />
  <circle cx="275" cy="130" r="17" fill="#fb7185" />
  <circle cx="275" cy="130" r="9" fill="#ffffff" />

  <!-- MEDORA Text -->
  <text x="256" y="432" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="76" 
        font-weight="900" 
        letter-spacing="5" 
        text-anchor="middle" 
        fill="#ffffff">
    MEDORA
  </text>
  <text x="256" y="474" 
        font-family="Cairo, system-ui, sans-serif" 
        font-size="26" 
        font-weight="700" 
        text-anchor="middle" 
        fill="#2dd4bf">
    ميدورا العراق
  </text>
</svg>
